# Verifies the generator itself: generates plugins from this working copy and runs their
# quality checks and test suites. Removed from generated plugins.
name: Skeleton
on:
  push:
    branches:
      - 'master'
  pull_request:

jobs:
  generate:
    name: Generate (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: everything
            type: plugin
            features: tests,ci
          - name: no tests
            type: plugin
            features: ci
          - name: nothing
            type: plugin
            features: ''
          - name: theme
            type: theme
            features: ci

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: skeleton

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          extensions: mbstring, xml, ctype, iconv, intl, mysql

      - name: Generate a ${{ matrix.type }}
        env:
          SKELETON_TYPE: ${{ matrix.type }}
          SKELETON_PACKAGE: acme/generated-${{ matrix.type }}
          SKELETON_NAME: Generated
          SKELETON_FEATURES: ${{ matrix.features }}
        run: |
          composer create-project forumify/plugin-skeleton generated \
            --repository='{"type":"path","url":"./skeleton","options":{"symlink":false}}' \
            --stability=dev --no-interaction --no-progress

      - name: Check that the skeleton removed itself
        working-directory: generated
        run: |
          test ! -d skeleton
          test -f README.md
          ! grep -rq "PluginSkeleton" --include='*.php' --include='*.json' src composer.json
          test "$(jq -r .type composer.json)" = "forumify-${{ matrix.type }}"

      - name: Check the theme's wiring
        if: matrix.type == 'theme'
        working-directory: generated
        run: |
          test ! -d config && test ! -d migrations && test ! -d tests
          php -r '
            require "vendor/autoload.php";
            $class = json_decode(file_get_contents("composer.json"), true)["extra"]["forumify-plugin-class"];
            $theme = new $class();
            if (!$theme instanceof Forumify\Plugin\AbstractForumifyTheme) { fwrite(STDERR, "$class is not a theme\n"); exit(1); }
            if ($theme->getThemeConfig()->vars === []) { fwrite(STDERR, "$class has no theme variables\n"); exit(1); }
            foreach ($theme->getStylesheets() as $stylesheet) {
              if (!is_file("public/$stylesheet")) { fwrite(STDERR, "public/$stylesheet does not exist\n"); exit(1); }
            }
          '

      - name: Run quality checks
        working-directory: generated
        run: make quality

      - name: Run tests
        if: contains(matrix.features, 'tests')
        working-directory: generated
        run: make tests
